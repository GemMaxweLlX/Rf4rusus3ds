name: Publish release

# Запуск вручную: Actions -> Publish release -> Run workflow, указать дату папки из releases/.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Папка релиза в releases/ (ГГГГ-ММ-ДД)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ inputs.date }}
        run: |
          set -e
          dir="releases/$DATE"
          test -d "$dir"
          notes="$dir/NOTES.md"
          if gh release view "v$DATE" >/dev/null 2>&1; then
            gh release edit "v$DATE" --notes-file "$notes"   # релиз уже есть - обновляем описание
            exit 0
          fi
          gh release create "v$DATE" "$dir"/*.zip \
            --title "Русский перевод RF4 — $DATE" \
            --notes-file "$notes" \
            --target "$GITHUB_SHA"
